<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kloe</title>
<meta name="description" content="standards-based, connection-agnostic LLM chat">
<meta name="theme-color" content="#5577a3">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Kloe">
<meta property="og:description" content="standards-based, connection-agnostic LLM chat">
<meta property="og:image" content="https://kloe.dunkirk.sh/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kloe">
<meta name="twitter:description" content="standards-based, connection-agnostic LLM chat">
<meta name="twitter:image" content="https://kloe.dunkirk.sh/og-image.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app" id="app">
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <nav class="rail" id="rail" aria-label="Conversations"></nav>

    <div class="main">
      <header class="head">
        <button class="icon menu" id="menu" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <span class="title" id="title">New conversation</span>
        <span class="connstat" id="status" data-state="connected" role="status" aria-live="polite"><span class="conn" id="conn"></span></span>
      </header>

      <div class="scroll" id="scroll">
        <div class="thread" id="thread"></div>
        <button class="jump" id="jump">↓ latest</button>
      </div>

      <div class="dock">
        <div class="dockinner">
          <div class="banner">offline — the stream dropped. Reconnecting; your place is kept and replays on return.</div>

          <div class="queue hidden" id="queue" aria-live="polite">
            <div class="qhead">
              <span class="qtitle">Queued</span>
              <span class="qcount" id="queueCount">0</span>
            </div>
            <ul class="qitems" id="queueItems"></ul>
          </div>

          <form class="card" id="composer">
            <textarea id="input" rows="1" placeholder="Reply, or ask something new…" aria-label="Message"></textarea>
            <div class="tools">
              <button class="icon attach" id="attach" type="button" aria-label="Add attachment" title="Add attachment">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              </button>
              <div class="right">
                <span class="ctx hidden" id="ctx" title="Approximate context window used">
                  <span class="bar" id="ctxbar"></span>
                  <span class="pct" id="ctxpct"></span>
                </span>
                <span class="pickwrap">
                  <button class="pill" id="pill" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>
                    <span class="m" id="pillModel">No models</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                  </button>
                  <div class="picker" id="picker" role="listbox" hidden></div>
                </span>
                <button class="send" id="send" type="submit" aria-label="Send" disabled></button>
                <button class="stopbtn" id="stop" type="button" aria-label="Stop" title="Stop the current run">
                  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.8"/></svg>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
