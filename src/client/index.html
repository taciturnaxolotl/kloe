<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kloe</title>
<meta name="description" content="standards-based, connection-agnostic LLM chat">
<meta name="theme-color" content="#5577a3">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Kloe">
<meta property="og:description" content="standards-based, connection-agnostic LLM chat">
<meta property="og:image" content="https://kloe.dunkirk.sh/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kloe">
<meta name="twitter:description" content="standards-based, connection-agnostic LLM chat">
<meta name="twitter:image" content="https://kloe.dunkirk.sh/og-image.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app" id="app">
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <!-- App shell: static rail chrome so the sidebar paints before app.js loads.
         sidebar.js wires it up and fills #railList. Icons mirror icons.js (Lucide). -->
    <nav class="rail" id="rail" aria-label="Conversations">
      <div class="railhead">
        <span class="brand">kloe</span>
        <div class="railactions">
          <a class="icon" id="searchBtn" href="/conversations" aria-label="Search conversations" title="Search conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></a>
          <button class="icon railx" id="railClose" type="button" aria-label="Close sidebar" title="Close sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
        </div>
      </div>
      <div class="railnav">
        <button class="navrow" id="new" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M8 12h8"/><path d="M12 8v8"/></svg><span>New conversation</span></button>
        <a class="navrow" id="chatsBtn" href="/conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></svg><span>Conversations</span></a>
        <a class="navrow" id="projectsBtn" href="/projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span>Projects</span></a>
      </div>
      <div class="raillabel">Recents</div>
      <div class="raillist" id="railList"></div>
      <div class="railfoots">
        <a class="railfoot railplug" href="/settings#connections" title="Connections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6"/><path d="M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"/><path d="M12 17v5"/></svg></a>
      <a class="railfoot" href="/settings" title="Settings">
        <img class="railpfp" id="railpfp" alt="" hidden>
        <span class="railgreet" id="railgreet" hidden></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
      </div>
    </nav>

    <div class="main">
      <!-- The chat view is the persistent home: its DOM (and its live SSE stream)
           stays mounted while satellite routes render into #viewOutlet, so peeking
           at Settings or Projects never tears the conversation down. The router
           (router.js) toggles which of the two is shown. -->
      <div class="chatshell" id="chatShell">
      <header class="head">
        <button class="icon menu" id="menu" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <span class="title" id="title">New conversation</span>
        <!-- Documents this chat has produced. Hidden until there is one. -->
        <button class="docsbtn" id="docsBtn" type="button" aria-haspopup="menu" title="Documents" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
          <span class="docscount" id="docsCount"></span>
        </button>
      </header>

      <div class="scroll" id="scroll">
        <div class="thread" id="thread"></div>
        <!-- Empty state. Shown by CSS whenever #thread has no turns, so nothing
             has to remember to toggle it. -->
        <div class="emptystate" id="emptyState" aria-hidden="true">
          <div class="rosette"><canvas id="rosette"></canvas></div>
        </div>
      </div>

      <div class="dock">
        <!-- The jump button anchors to the composer, not to the thread: inside
             .scroll it was absolutely positioned against a scrolling box, so it
             drifted up into the middle of the text as you scrolled. -->
        <div class="dockinner">
          <button class="jump" id="jump" type="button" title="Scroll to latest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>Jump to bottom</button>
          <div class="queue hidden" id="queue" aria-live="polite">
            <div class="qhead">
              <span class="qtitle">Queued</span>
              <span class="qcount" id="queueCount">0</span>
            </div>
            <ul class="qitems" id="queueItems"></ul>
          </div>

          <form class="card" id="composer" data-conn="live">
            <!-- Connection hat: collapsed to nothing while live; conn.js fills it. -->
            <div class="hat" id="hat" data-state="live" role="status" aria-live="polite"></div>
            <div class="staged hidden" id="staged" aria-label="Attachments"></div>
            <textarea id="input" rows="1" placeholder="Reply, or ask something new…" aria-label="Message"></textarea>
            <div class="tools">
              <button class="icon attach" id="attach" type="button" aria-label="Add attachment" title="Add attachment">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              </button>
              <div class="right">
                <span class="ctx hidden" id="ctx" title="Approximate context window used">
                  <span class="ctxtrack"><canvas id="ctxbar" aria-hidden="true"></canvas></span>
                  <span class="pct" id="ctxpct"></span>
                </span>
                <span class="pickwrap">
                  <button class="pill" id="pill" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>
                    <span class="m" id="pillModel">No models</span>
                    <span class="e" id="pillEffort" hidden></span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                  </button>
                  <div class="picker" id="picker" role="listbox" hidden></div>
                </span>
                <button class="send" id="send" type="submit" aria-label="Send" disabled></button>
                <button class="stopbtn" id="stop" type="button" aria-label="Stop" title="Stop the current run">
                  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.8"/></svg>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      </div>
      <!-- Satellite routes (Conversations, Projects, Settings) mount here; hidden
           while the chat view is showing. -->
      <div class="viewoutlet" id="viewOutlet" hidden></div>
    </div>

    <!-- Artifact pane: a document opened out of the thread. Sits beside the
         conversation on wide screens and over it on narrow ones. -->
    <aside class="pane" id="pane" hidden aria-label="Document">
      <!-- Drag the seam between the conversation and the document. -->
      <button class="paneresize" id="paneResize" type="button" aria-label="Resize document" title="Drag to resize"></button>
      <header class="panehead">
        <button class="icon panefull" id="paneFull" type="button" aria-label="Expand document" title="Expand document">
          <svg class="ifull" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/></svg>
          <svg class="ismall" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 10 7-7"/><path d="M20 10h-6V4"/><path d="m3 21 7-7"/><path d="M4 14h6v6"/></svg>
        </button>
        <span class="panetitle" id="paneTitle"></span>
        <div class="paneactions">
          <!-- Split button: Copy is the action, the chevron is everything else. -->
          <button class="panebtn panepub" id="panePublic" type="button" hidden title="Copy the public link">Public</button>
          <button class="panebtn panever" id="paneVersions" type="button" hidden aria-haspopup="menu"></button>
          <button class="panebtn" id="paneSourceBtn" type="button" hidden>Source</button>
          <span class="split" id="paneDocActions">
            <button class="panebtn" id="paneCopy" type="button">Copy</button>
            <button class="panebtn splitmore" id="paneMore" type="button" aria-haspopup="menu" aria-label="More document actions">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </span>
          <button class="icon panex" id="paneClose" type="button" aria-label="Close document" title="Close document">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </header>
      <div class="panebody" id="paneBody"></div>
    </aside>

  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
