<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kloe</title>
<meta name="description" content="standards-based, connection-agnostic LLM chat">
<meta name="theme-color" content="#5577a3">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Kloe">
<meta property="og:description" content="standards-based, connection-agnostic LLM chat">
<meta property="og:image" content="https://kloe.dunkirk.sh/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kloe">
<meta name="twitter:description" content="standards-based, connection-agnostic LLM chat">
<meta name="twitter:image" content="https://kloe.dunkirk.sh/og-image.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app" id="app">
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <nav class="rail" id="rail" aria-label="Conversations"></nav>
    <div class="main">
      <header class="head">
        <button class="icon menu" id="menu" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <span class="title">Settings</span>
      </header>
      <div class="chatscroll">
        <div class="setpage">
          <h2 class="shead">Models</h2>
          <p class="lede">Turn models on to add them to the chat picker, drag the enabled ones to set their order (⌘-click to move several at once), and give them display names.</p>
          <div id="content">Loading…</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./settings.js"></script>
</body>
</html>
