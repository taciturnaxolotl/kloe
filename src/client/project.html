<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Project · Kloe</title>
<meta name="theme-color" content="#5577a3">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app" id="app">
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <nav class="rail" id="rail" aria-label="Conversations">
      <div class="railhead">
        <span class="brand">kloe</span>
        <div class="railactions">
          <a class="icon" id="searchBtn" href="/conversations" aria-label="Search conversations" title="Search conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></a>
          <button class="icon railx" id="railClose" type="button" aria-label="Close sidebar" title="Close sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
        </div>
      </div>
      <div class="railnav">
        <button class="navrow" id="new" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M8 12h8"/><path d="M12 8v8"/></svg><span>New chat</span></button>
        <a class="navrow" id="chatsBtn" href="/conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></svg><span>Conversations</span></a>
        <a class="navrow active" id="projectsBtn" href="/projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span>Projects</span></a>
      </div>
      <div class="raillabel">Recents</div>
      <div class="raillist" id="railList"></div>
      <a class="railfoot" href="/settings" title="Settings">
        <img class="railpfp" id="railpfp" alt="" hidden>
        <span class="railgreet" id="railgreet" hidden></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
    </nav>
    <div class="main">
      <header class="head">
        <button class="icon menu" id="menu" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <nav class="crumbs"><a href="/projects">Projects</a><span class="crumbsep">/</span><span id="crumbname" class="title">…</span></nav>
        <div class="chatsactions">
          <button class="icon" id="projMenu" type="button" aria-label="Project options" title="Project options"></button>
        </div>
      </header>
      <div class="chatscroll">
        <div class="projdetail" id="detail" hidden>
          <div class="projcol">
            <h1 class="projtitle" id="pname">…</h1>
            <p class="projsub" id="pdesc"></p>
            <button class="btn primary projnew" id="newChat" type="button">New chat in this project</button>
            <div class="raillabel">Chats</div>
            <div class="chatrows" id="rows"><div class="chatsempty">No chats yet.</div></div>
          </div>
          <aside class="projaside">
            <section class="projpanel">
              <div class="panelhead"><span>Memory</span><button class="panelbtn" id="memEdit" type="button" aria-label="Change pinned project"></button></div>
              <div class="panelbody" id="memBody"></div>
            </section>
            <section class="projpanel">
              <div class="panelhead"><span>Context</span><button class="panelbtn" id="ctxAdd" type="button" aria-label="Add a context file"></button></div>
              <div class="panelbody" id="ctxBody"></div>
            </section>
          </aside>
        </div>
      </div>
    </div>
  </div>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,.text,.json,.csv,.yaml,.yml,text/*" hidden>
  <div class="modal" id="detailsModal" hidden>
    <div class="modalback" id="detailsBack"></div>
    <div class="modalcard">
      <div class="modalh">Project details</div>
      <label class="modallabel" for="mName">Name</label>
      <input class="modalinput" id="mName" maxlength="120">
      <label class="modallabel" for="mDesc">Description</label>
      <textarea class="modaltext" id="mDesc" rows="3" maxlength="2000" placeholder="What is this project about?"></textarea>
      <div class="modalbtns">
        <button class="btn" id="mCancel" type="button">Cancel</button>
        <button class="btn primary" id="mSave" type="button">Save</button>
      </div>
    </div>
  </div>
  <script type="module" src="./project.js"></script>
</body>
</html>
