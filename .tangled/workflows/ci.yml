when:
  - event: ["push", "pull_request"]
    branch: main

engine: microvm
# No `image:` → the spindle's configured default (a NixOS image) is used, so
# this doesn't depend on a specific image name being present on the host.
# `dependencies` only take effect on a NixOS image.

dependencies:
  - bun

steps:
  - name: install
    command: |
      bun install --frozen-lockfile

  - name: lint + format (biome)
    command: |
      bunx biome ci .

  - name: typecheck
    command: |
      bunx tsc --noEmit

  - name: test
    command: |
      bun test
