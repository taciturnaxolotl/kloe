when:
  - event: ["push", "pull_request"]
    branch: ["main"]

# terebithia's spindle has no pre-built microVM images; the nixery engine builds
# an image on demand from the nixpkgs packages listed under `dependencies`.
engine: nixery

dependencies:
  nixpkgs:
    - bun
    - git
    - cacert

steps:
  - name: install
    command: |
      bun install --frozen-lockfile

  - name: lint + format (biome)
    command: |
      bunx biome ci .

  - name: typecheck
    command: |
      bunx tsc --noEmit

  - name: test
    command: |
      bun test
