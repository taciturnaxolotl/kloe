when:
  - event: ["push", "pull_request"]
    branch: ["main"]

# terebithia's spindle has no pre-built microVM images; the nixery engine builds
# an image on demand from the nixpkgs packages below.
engine: nixery

dependencies:
  nixpkgs:
    # biome comes from nixpkgs (nix-built), NOT the npm @biomejs/biome binary —
    # that's a prebuilt glibc-FHS binary and won't execute in a pure-nix image.
    - bun
    - biome
    - git
    - cacert

steps:
  - name: install
    command: |
      bun install --frozen-lockfile

  - name: lint + format (biome)
    command: |
      biome ci .

  - name: typecheck
    command: |
      bunx tsc --noEmit

  - name: test
    command: |
      bun test
