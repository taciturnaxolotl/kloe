when:
  - event: ["push", "pull_request"]
    branch: ["main"]

# terebithia's spindle has no pre-built microVM images, so use the nixery engine:
# it builds an image on demand from the nixpkgs packages below. Everything runs
# nix-native — prebuilt npm binaries (biome, the native TS compiler) can't
# execute in a pure-nix image, so the tools come from nixpkgs instead.
engine: nixery

dependencies:
  # stable channel: bun runs the app/tests, typescript 5.9.3 matches the pinned
  # devDependency exactly (its tsc brings its own node), git + certs for clone.
  nixpkgs:
    - bun
    - typescript
    - git
    - cacert
  # biome from unstable — the stable channel here pins an old 2.3.x with a
  # static-member false positive; unstable tracks a current 2.5.x that agrees
  # with the config and the npm biome GitHub Actions uses.
  nixpkgs/nixpkgs-unstable:
    - biome

steps:
  - name: install
    command: |
      bun install --frozen-lockfile

  - name: lint + format (biome)
    command: |
      biome ci .

  - name: typecheck
    command: |
      tsc --noEmit

  - name: test
    command: |
      bun test
