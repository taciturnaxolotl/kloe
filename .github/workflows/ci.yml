name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint + format (biome)
        run: bunx biome ci .
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
