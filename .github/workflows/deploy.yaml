name: Deploy Kloe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  deploy:
    uses: taciturnaxolotl/dots/.github/workflows/deploy-service.yml@main
    with:
      service: kloe
      health_url: https://kloe.dunkirk.sh/health
      db_path: /var/lib/kloe/data/kloe.db
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
